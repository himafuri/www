# Toolchain sandbox: pins Node 24 LTS + pnpm 10 (Payload doesn't support pnpm 11).
# The database is Cloudflare D1, so there is NO local db service here - the D1
# binding is provided by the Cloudflare runtime (wrangler / @opennextjs/cloudflare),
# not by docker-compose.
# Debian (-slim), NOT alpine: wrangler's workerd needs glibc and won't run on musl.
services:
  payload:
    image: node:24-slim
    init: true
    ports:
      - "3000:3000"
    volumes:
      - .:/home/node/app
      - node_modules:/home/node/app/node_modules
    working_dir: /home/node/app
    command: sh -c "corepack enable && corepack prepare pnpm@latest-10 --activate && pnpm install && pnpm dev"
    env_file:
      - .env

  # Playwright e2e runner. Behind the "test" profile so a normal `docker compose
  # up` never starts it. It starts its own `pnpm dev` (via playwright.config.ts
  # webServer) inside this container, so it does not depend on the payload
  # service. Run it with: docker compose run --rm playwright
  #
  # Uses Microsoft's official Playwright image, which ships Chromium + the OS
  # libraries the browser needs, pre-pinned to the @playwright/test version in
  # package.json. node:24-slim has no browser, and downloading one at build time
  # pulls from cdn.playwright.dev, which stalls intermittently.
  playwright:
    image: mcr.microsoft.com/playwright:v1.60.0-noble
    init: true
    profiles: ["test"]
    volumes:
      - .:/home/node/app
      # Separate from the payload service's volume: this image ships a different
      # Node than the dev service, so their native modules must not be shared.
      - playwright_node_modules:/home/node/app/node_modules
    working_dir: /home/node/app
    command: sh -c "corepack enable && corepack prepare pnpm@latest-10 --activate && pnpm install && pnpm test:e2e"
    env_file:
      - .env

volumes:
  node_modules:
  playwright_node_modules:
